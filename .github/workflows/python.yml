name: Python en contenedor
on: push
jobs:
  build-python:
    runs-on: ubuntu-latest
    container: python:3.12

    steps:
      - name: Verificar entorno
        run: |
          echo "Ejecutando dentro de un contenedor de Python"
          python --version

      - name: Ejecutar una accion dentro del contenedor
        run: python -c "print('Hola desde Python en GitHub Actions')"
